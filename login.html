
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Connect</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-layout">
    <section class="auth-brand">
      <a class="auth-logo" href="index.html"><span>C</span> connect.</a>
      <div>
        <span class="auth-eyebrow">SUA REDE. SUAS CONEXÕES.</span>
        <h1>Um mundo de<br>conexões começa<br>com você.</h1>
        <p>Compartilhe momentos, conheça pessoas e faça parte de uma comunidade.</p>
      </div>
      <small>Connect © 2026</small>
    </section>

    <section class="auth-main">
      <form class="auth-card" id="loginForm">
        <span class="auth-eyebrow">BEM-VINDO DE VOLTA</span>
        <h2>Entre na sua conta</h2>
        <p class="auth-description">Acesse sua comunidade Connect.</p>

        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>

        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" required>

        <p class="auth-error" id="authError" role="alert"></p>
        <button class="auth-submit" id="submitButton" type="submit">Entrar</button>

        <p class="auth-switch">Ainda não tem conta? <a href="cadastro.html">Criar uma conta</a></p>
      </form>
    </section>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
