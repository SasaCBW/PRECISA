<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil | Connect</title>
  <link rel="stylesheet" href="auth.css">

  <style>
    .profile-card {
      width: 100%;
      max-width: 620px;
      padding: 35px;
      border: 1px solid #e8e8f0;
      border-radius: 20px;
      background: white;
      box-shadow: 0 18px 55px rgba(42,39,93,.09);
    }

    .profile-cover {
      height: 130px;
      margin: -35px -35px 0;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(120deg,#7565ef,#53b8d2);
    }

    .profile-avatar {
      display: grid;
      width: 100px;
      height: 100px;
      place-items: center;
      margin-top: -50px;
      border: 5px solid white;
      border-radius: 50%;
      background: #efedff;
      color: #6655e8;
      font-size: 35px;
      font-weight: 800;
    }

    .profile-card h1 {
      margin-top: 15px;
      font-size: 25px;
    }

    .profile-username {
      margin-top: 5px;
      color: #777990;
      font-size: 14px;
    }

    .profile-bio {
      margin: 20px 0;
      color: #55556b;
      line-height: 1.6;
    }

    .profile-stats {
      display: flex;
      gap: 25px;
      padding: 18px 0;
      border-top: 1px solid #eeeef4;
      border-bottom: 1px solid #eeeef4;
      color: #777990;
      font-size: 13px;
    }

    .profile-stats strong {
      color: #202139;
    }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .profile-actions button,
    .profile-actions a {
      padding: 12px 17px;
      border: 0;
      border-radius: 9px;
      background: #6655e8;
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .profile-actions .secondary {
      background: #efedff;
      color: #5140ce;
    }

    .profile-status {
      min-height: 20px;
      margin-top: 15px;
      color: #6655e8;
      font-size: 13px;
    }

    .profile-edit {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #eeeef4;
    }

    .profile-edit.open {
      display: block;
    }

    .profile-edit label {
      display: block;
      margin: 13px 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .profile-edit input,
    .profile-edit textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e8e8f0;
      border-radius: 9px;
      font: inherit;
    }

    .profile-edit textarea {
      min-height: 90px;
      resize: vertical;
    }

    @media(max-width:480px) {
      .profile-card { padding: 23px; }
      .profile-cover { margin: -23px -23px 0; }
      .profile-stats { gap: 13px; }
    }
  </style>
</head>

<body>
  <main class="auth-page">
    <a class="auth-brand" href="index.html"><span>C</span> connect.</a>

    <section class="profile-card">
      <div class="profile-cover"></div>

      <div class="profile-avatar" id="profileAvatar">C</div>

      <h1 id="profileName">Carregando perfil...</h1>
      <p class="profile-username" id="profileUsername"></p>
      <p class="profile-bio" id="profileBio"></p>

      <div class="profile-stats">
        <span><strong id="postsCount">0</strong> publicações</span>
        <span><strong id="followersCount">0</strong> seguidores</span>
        <span><strong id="followingCount">0</strong> seguindo</span>
      </div>

      <div class="profile-actions">
        <button type="button" id="editProfileButton">Editar perfil</button>
        <a class="secondary" href="index.html">Voltar ao feed</a>
        <button type="button" class="secondary" id="logoutButton">Sair</button>
      </div>

      <p class="profile-status" id="profileStatus" role="status"></p>

      <form class="profile-edit" id="profileEditForm">
        <label for="editName">Nome</label>
        <input id="editName" type="text" maxlength="60" required>

        <label for="editBio">Biografia</label>
        <textarea id="editBio" maxlength="180"></textarea>

        <button class="auth-button" type="submit" id="saveProfileButton">
          Salvar alterações
        </button>
      </form>
    </section>

    <footer class="auth-footer">Connect © 2026 · Feito para conectar.</footer>
  </main>

  <script type="module" src="perfil.js"></script>
</body>
</html>
