<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta gratuita no Connect.">
  <title>Criar conta | Connect</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="auth-brand" href="index.html"><span>C</span> connect.</a>

    <section class="auth-card">
      <div class="auth-icon">✦</div>
      <h1>Faça parte do Connect!</h1>
      <p class="auth-subtitle">Crie sua conta e comece a compartilhar suas ideias.</p>

      <form id="registerForm">
        <label for="name">Nome completo</label>
        <input id="name" type="text" placeholder="Como podemos chamar você?" required maxlength="60" autocomplete="name">

        <label for="username">Nome de usuário</label>
        <input id="username" type="text" placeholder="Ex.: sara123" required minlength="3" maxlength="20" autocomplete="username">

        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seuemail@exemplo.com" required autocomplete="email">

        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Crie uma senha com pelo menos 6 caracteres" required minlength="6" autocomplete="new-password">

        <label for="confirmPassword">Confirmar senha</label>
        <input id="confirmPassword" type="password" placeholder="Digite a senha novamente" required minlength="6" autocomplete="new-password">

        <button class="auth-button" type="submit" id="registerButton">Criar minha conta</button>
      </form>

      <p class="auth-message" id="authMessage" role="status"></p>

      <p class="auth-switch">Já possui uma conta? <a href="login.html">Entrar</a></p>
      <a class="back-link" href="index.html">← Voltar para o Connect</a>
    </section>

    <footer class="auth-footer">Connect © 2026 · Feito para conectar.</footer>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
