
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Connect</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .error-page {
      max-width: 480px;
      text-align: center;
      background: white;
      padding: 45px 30px;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(26,35,66,.06);
    }
    .error-number {
      font-size: 80px;
      font-weight: 800;
      color: #6558e8;
      line-height: 1;
    }
    .error-page h1 { font-size: 25px; }
    .error-page p { color: #7e899d; line-height: 1.7; }
    .error-page a {
      display: inline-block;
      margin-top: 15px;
      background: #6558e8;
      color: white;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-number">404</div>
    <h1>Esta página não foi encontrada.</h1>
    <p>O endereço pode estar incorreto ou a página pode não existir mais.</p>
    <a href="index.html">Voltar para a Connect</a>
  </main>
</body>
</html>
